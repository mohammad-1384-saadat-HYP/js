    <body>

        <div id="container">
            <h1>فرم ثبت نام</h1>
            <div id="operations">
                <div class="holders">
                    <div class="tittles">نام و نام خانوادگی</div>
                    <label>
                        <input type="text" id="name" class="input" title="لطفا نام و نام خانوادگی خود را وارد کنید">
                    </label>
                </div>
                <div class="holders">
                    <div class="tittles">سن</div>
                    <label>
                        <input type="text" id="age" class="input" title="لطفا سن خود را وارد کنید">
                    </label>
                </div>
                <div class="holders">
                    <div class="tittles">مهارت ها</div>
                    <label>
                        <input type="text" id="skill" class="input" title="اگر در حال حاضر مهارتی در ضمینه برنامه نویسی دارید وارد کنید">
                    </label>
                </div>
                <div class="holders">
                    <button onclick="registration()" id="registration">ثبت</button>
                </div>
            </div>
            <div id="search">
                <label for="searchInput">جستجو:</label>
                <input type="text" id="searchInput" oninput="search()">
            </div>
            <table id="result">
                <caption><h2>اطلاعات شما</h2></caption>
                <thead>
                    <tr>
                        <th id="first">نام و نام خانوادگی</th>
                        <th id="second">سن</th>
                        <th id="third">مهارت ها</th>
                        <th id="fourth">عملیات ها</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
