<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>تمرین 4</title>

</head>

<body>

<label>
    <input class="input" type="text" placeholder="عدد مورد نظر را وارد کنید">
    <input class="input" type="text" placeholder="عدد مورد نظر را وارد کنید">
    <input class="input" type="text" placeholder="عدد مورد نظر را وارد کنید">
    <input class="input" type="text">
</label>

<script>

    document.querySelectorAll('.input').forEach((input) => {
        input.addEventListener('keydown', (x) => {
            if (!/^[0-9]$/.test(x.key) && !['Backspace', 'ArrowLeft', 'ArrowRight'].includes(x.key)) {
                x.preventDefault();
            }
        });
        input.addEventListener('input', () => {
            let a = input.value.replace(/,/g, '');
            input.value = Number(a).toLocaleString();
        });
    });

</script>

</body>

</html>
