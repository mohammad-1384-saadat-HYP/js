<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>تمرین 3+</title>

    <style>

        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #container {
            position: relative;
            width: 80%;
            height: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        button {
            border: none;
            border-radius: 50px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.35;
            font-size: 10px;
            transition: opacity 0.3s, font-size 0.3s;
            padding: 5px 7px 6px;
            background-color: #ffffff;
            cursor: pointer;
            z-index: 10;
        }

        button:hover {
            opacity: 1;
            font-size: 25px;
        }

        #left {
            left: 0;
        }

        #right {
            right: 0;
        }

        #images {
            display: flex;
            transition: transform 0.5s ease-in-out;
            align-items: center;
        }

        img {
            width: 100%;
            height: 100vh;
        }

    </style>

</head>

<body>

<div id="container">
    <button id="left">&#10094;</button>
    <div id="images">
        <img src="./images/aurora.png" alt="aurora">
        <img src="./images/green.png" alt="green">
        <img src="./images/calm-picture.PNG" alt="calm picture">
    </div>
    <button id="right">&#10095;</button>
</div>

<script>

    const left = document.getElementById('left');
    const right = document.getElementById('right');
    const images = document.getElementById('images');
    const container = document.getElementById('container');
    const img = document.querySelectorAll('#images img');
    let index = 0;

    function showSlide() {
        const slideWidth = container.clientWidth; // عرض واقعی اسلایدر
        images.style.transform = `translateX(-${index * slideWidth}px)`;
    }

    // تنظیم عرض صحیح برای #images
    function setImagesWidth() {
        images.style.width = `${container.clientWidth * img.length}px`;
        img.forEach(image => {
            image.style.width = `${container.clientWidth}px`;
        });
        showSlide(); // اصلاح جایگاه اسلاید فعلی بعد از تغییر اندازه
    }

    // کلیک روی دکمه‌های چپ و راست
    left.addEventListener('click', () => {
        index = (index === 0) ? img.length - 1 : index - 1;
        showSlide();
    });

    right.addEventListener('click', () => {
        index = (index === img.length - 1) ? 0 : index + 1;
        showSlide();
    });

    // اصلاح اندازه‌ی اسلایدر هنگام تغییر صفحه
    window.addEventListener('resize', setImagesWidth);
    window.addEventListener('load', setImagesWidth);

</script>

</body>

</html>
