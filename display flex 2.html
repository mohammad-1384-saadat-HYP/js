<!DOCTYPE html>
<html lang="en">

    <head>

        <title>تمرین 2</title>

        <style>

            #div{
                display: flex;
                width: 100%;
                height: 97vh;
                font-family: Arial, sans-serif;

            #div1, #div2{
                width: 50%;

                margin: 30px;

            }

            }

</html>
